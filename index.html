<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebRTC Pong</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 1rem; }
    h1 { margin-top: 0; }
    code { background: #eee; padding: 0.1rem 0.3rem; border-radius: 3px; }
    #qr { margin: 1rem 0; image-rendering: pixelated; }
    canvas#field { display: block; margin: 0.5rem auto; background: #111;
                   border-radius: 6px; touch-action: none; max-width: 100%; height: auto; }
    #log { background: #f4f4f4; padding: 0.5rem 0.75rem; min-height: 60px; max-height: 120px;
           overflow-y: auto; white-space: pre-wrap; font-family: ui-monospace, monospace;
           font-size: 0.8rem; border-radius: 4px; }
    .status { padding: 0.5rem 0.75rem; border-radius: 4px; margin: 0.5rem 0; }
    .waiting   { background: #fff3cd; }
    .connected { background: #d4edda; }
    .share-link { word-break: break-all; }
    .scoreline { text-align: center; font-size: 1.5rem; font-family: ui-monospace, monospace;
                 margin: 0.25rem 0; letter-spacing: 0.2rem; }
    .scoreline .host   { color: #0a0; }
    .scoreline .client { color: #088; }
    .hint { text-align: center; color: #666; font-size: 0.8rem; margin: 0.25rem 0 1rem; }
  </style>
</head>
<body>
  <h1>WebRTC Pong</h1>
  <div id="status" class="status waiting">Connecting…</div>

  <p>Room: <code id="room-name"></code></p>
  <p>Share this link or QR:</p>
  <canvas id="qr"></canvas>
  <p><a id="share-link" class="share-link" href=""></a></p>

  <div class="scoreline">
    <span class="host"   id="score-host">0</span>
    <span> — </span>
    <span class="client" id="score-client">0</span>
  </div>
  <canvas id="field" width="600" height="400"></canvas>
  <p class="hint">Arrow keys / W-S — or drag on the field (mobile)</p>

  <div id="log" aria-live="polite"></div>

  <script type="module">
    import { joinRoom, selfId } from 'https://esm.sh/trystero@0.24.0'
    import QRCode               from 'https://esm.sh/qrcode@1.5.4'

    // ── Rendezvous: take room ID from URL, or generate one and rewrite URL ───
    const roomId = new URLSearchParams(location.search).get('room') || (() => {
      const id = Math.random().toString(36).slice(2, 8)
      history.replaceState(null, '', `${location.pathname}?room=${id}`)
      return id
    })()
    const shareUrl = `${location.origin}${location.pathname}?room=${roomId}`
    document.getElementById('room-name').textContent = roomId
    const shareLink = document.getElementById('share-link')
    shareLink.href = shareLink.textContent = shareUrl
    QRCode.toCanvas(document.getElementById('qr'), shareUrl, { width: 220 })

    // ── DOM refs + tiny helpers ──────────────────────────────────────────────
    const statusEl    = document.getElementById('status')
    const logEl       = document.getElementById('log')
    const hostScoreEl = document.getElementById('score-host')
    const clientScoreEl = document.getElementById('score-client')
    const fieldCanvas = document.getElementById('field')
    const ctx = fieldCanvas.getContext('2d')

    const setStatus = (text, cls) => { statusEl.textContent = text; statusEl.className = `status ${cls}` }
    const log = line => { logEl.textContent += line + '\n'; logEl.scrollTop = logEl.scrollHeight }
    setStatus('Waiting for opponent…', 'waiting')

    // ── Game state ───────────────────────────────────────────────────────────
    const W = 600, H = 400, PADDLE_H = 80, PADDLE_W = 10, BALL_R = 8
    const PADDLE_SPEED = 380, BALL_SPEED = 280

    let myRole = null                                  // 'host' | 'client' | null
    const otherRole = r => r === 'host' ? 'client' : 'host'

    const state = {
      paddles: { host: (H - PADDLE_H) / 2, client: (H - PADDLE_H) / 2 },
      ball:    { x: W / 2, y: H / 2, vx: BALL_SPEED, vy: BALL_SPEED * 0.4 },
      score:   { host: 0, client: 0 },
    }
    const renderScore = () => {
      hostScoreEl.textContent   = state.score.host
      clientScoreEl.textContent = state.score.client
    }

    // ════════════════════════════════════════════════════════════════════════
    // NETWORKING (the part to lift into your own game)
    //
    //   1. joinRoom()        — open the room
    //   2. makeAction(name)  — define a typed channel, returns [send, on]
    //   3. on*() handlers    — react to incoming messages
    //   4. onPeerJoin        — elect roles deterministically via selfId compare
    //   5. setInterval       — 30Hz send loop for state snapshots
    //
    // Host authority: one peer owns the simulation, broadcasts state. The
    // other peer renders snapshots. Each peer ALSO runs its own paddle
    // locally for zero-latency input; their paddle Y is mirrored to the
    // other side at 30Hz.
    // ════════════════════════════════════════════════════════════════════════
    const room = joinRoom({
      appId: 'moretticb-game-v1',
      relayConfig: {
        urls: ['wss://relay.damus.io', 'wss://nos.lol',
               'wss://relay.nostr.band', 'wss://nostr.wine'],
        redundancy: 3,
      },
    }, roomId)

    const [sendPaddle, onPaddle] = room.makeAction('paddle')
    const [sendBall,   onBall]   = room.makeAction('ball')
    const [sendScore,  onScore]  = room.makeAction('score')

    onPaddle(y => { if (myRole) state.paddles[otherRole(myRole)] = y })
    onBall  (b => { if (myRole === 'client') state.ball = b })
    onScore (s => { state.score = s; renderScore() })

    room.onPeerJoin(peerId => {
      myRole = selfId < peerId ? 'host' : 'client'   // both peers agree
      setStatus(`Connected — you are the ${myRole.toUpperCase()} paddle`, 'connected')
      log(`peer ${peerId.slice(0, 8)} joined → I am ${myRole}`)
      if (myRole === 'host') resetBall(Math.random() < 0.5 ? 1 : -1)
    })

    room.onPeerLeave(peerId => {
      log(`peer ${peerId.slice(0, 8)} left`)
      myRole = null
      setStatus('Waiting for opponent…', 'waiting')
    })

    setInterval(() => { if (myRole)            sendPaddle(state.paddles[myRole]) }, 33)
    setInterval(() => { if (myRole === 'host') sendBall(state.ball)              }, 33)

    // ── Input ────────────────────────────────────────────────────────────────
    const input = { up: false, down: false, touchY: null }
    const KEYS = { up: ['ArrowUp', 'w', 'W'], down: ['ArrowDown', 's', 'S'] }

    addEventListener('keydown', e => {
      if (KEYS.up  .includes(e.key)) { input.up   = true; e.preventDefault() }
      if (KEYS.down.includes(e.key)) { input.down = true; e.preventDefault() }
    })
    addEventListener('keyup', e => {
      if (KEYS.up  .includes(e.key)) input.up   = false
      if (KEYS.down.includes(e.key)) input.down = false
    })

    const onTouch = e => {
      const r = fieldCanvas.getBoundingClientRect()
      input.touchY = (e.touches[0].clientY - r.top) * (H / r.height)
      e.preventDefault()
    }
    fieldCanvas.addEventListener('touchstart', onTouch, { passive: false })
    fieldCanvas.addEventListener('touchmove',  onTouch, { passive: false })
    fieldCanvas.addEventListener('touchend',   () => input.touchY = null)

    // ── Simulation ───────────────────────────────────────────────────────────
    const resetBall = dir => Object.assign(state.ball, {
      x: W / 2, y: H / 2,
      vx: BALL_SPEED * dir,
      vy: BALL_SPEED * (Math.random() * 0.6 - 0.3),
    })

    const bouncePaddle = (paddleY, side) => {
      const b = state.ball
      const reaching = side === 'left'
        ? b.vx < 0 && b.x - BALL_R < PADDLE_W
        : b.vx > 0 && b.x + BALL_R > W - PADDLE_W
      if (!reaching || b.y < paddleY || b.y > paddleY + PADDLE_H) return
      b.x  = side === 'left' ? PADDLE_W + BALL_R : W - PADDLE_W - BALL_R
      b.vx = -b.vx * 1.05
      b.vy = BALL_SPEED * ((b.y - (paddleY + PADDLE_H / 2)) / (PADDLE_H / 2))
    }

    let lastT = performance.now()
    const step = now => {
      const dt = Math.min(0.05, (now - lastT) / 1000)   // clamp to avoid tab-out teleport
      lastT = now

      // My paddle: always local — instant input, no network round-trip.
      if (myRole) {
        let y = state.paddles[myRole]
        if (input.touchY !== null) y = input.touchY - PADDLE_H / 2
        else {
          if (input.up)   y -= PADDLE_SPEED * dt
          if (input.down) y += PADDLE_SPEED * dt
        }
        state.paddles[myRole] = Math.max(0, Math.min(H - PADDLE_H, y))
      }

      // Ball + scoring: host-only. Client just renders received snapshots.
      if (myRole === 'host') {
        const b = state.ball
        b.x += b.vx * dt
        b.y += b.vy * dt
        if (b.y < BALL_R)     { b.y = BALL_R;     b.vy =  Math.abs(b.vy) }
        if (b.y > H - BALL_R) { b.y = H - BALL_R; b.vy = -Math.abs(b.vy) }
        bouncePaddle(state.paddles.host,   'left')
        bouncePaddle(state.paddles.client, 'right')

        if (b.x < -BALL_R)         { state.score.client++; sendScore(state.score); renderScore(); resetBall( 1) }
        else if (b.x > W + BALL_R) { state.score.host++;   sendScore(state.score); renderScore(); resetBall(-1) }
      }

      draw()
      requestAnimationFrame(step)
    }

    // ── Render ───────────────────────────────────────────────────────────────
    const draw = () => {
      ctx.fillStyle = '#111';   ctx.fillRect(0, 0, W, H)
      ctx.strokeStyle = '#333'; ctx.setLineDash([6, 8])
      ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke()
      ctx.setLineDash([])
      ctx.fillStyle = '#0f0';   ctx.fillRect(0,          state.paddles.host,   PADDLE_W, PADDLE_H)
      ctx.fillStyle = '#0ff';   ctx.fillRect(W-PADDLE_W, state.paddles.client, PADDLE_W, PADDLE_H)
      ctx.fillStyle = '#fff'
      ctx.beginPath(); ctx.arc(state.ball.x, state.ball.y, BALL_R, 0, Math.PI * 2); ctx.fill()
    }

    requestAnimationFrame(step)
  </script>
</body>
</html>
